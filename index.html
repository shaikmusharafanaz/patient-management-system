
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>Patient Management System</h1>
            <p>Manage patient records efficiently</p>
        </header>

        <section class="form-section">
            <h2 id="formTitle">Add New Patient</h2>

            <form id="patientForm">

                <input type="hidden" id="editIndex">

                <div class="form-grid">

                    <div>
                        <label>Patient Name</label>
                        <input type="text" id="name"
                               placeholder="Enter patient name" required>
                    </div>

                    <div>
                        <label>Age</label>
                        <input type="number" id="age"
                               placeholder="Enter age" min="0" max="130"
                               required>
                    </div>

                    <div>
                        <label>Gender</label>
                        <select id="gender" required>
                            <option value="">Select Gender</option>
                            <option>Male</option>
                            <option>Female</option>
                            <option>Other</option>
                        </select>
                    </div>

                    <div>
                        <label>Phone Number</label>
                        <input type="tel" id="phone"
                               placeholder="Enter phone number"
                               pattern="[0-9]{10}" required>
                    </div>

                    <div>
                        <label>Email</label>
                        <input type="email" id="email"
                               placeholder="Enter email" required>
                    </div>

                    <div>
                        <label>Blood Group</label>
                        <select id="blood" required>
                            <option value="">Select Blood Group</option>
                            <option>A+</option>
                            <option>A-</option>
                            <option>B+</option>
                            <option>B-</option>
                            <option>O+</option>
                            <option>O-</option>
                            <option>AB+</option>
                            <option>AB-</option>
                        </select>
                    </div>

                    <div>
                        <label>Doctor Name</label>
                        <input type="text" id="doctor"
                               placeholder="Enter doctor name" required>
                    </div>

                    <div>
                        <label>Appointment Date</label>
                        <input type="date" id="date" required>
                    </div>

                    <div class="full-width">
                        <label>Address</label>
                        <textarea id="address"
                                  placeholder="Enter patient address"
                                  required></textarea>
                    </div>

                </div>

                <div class="buttons">
                    <button type="submit" id="submitBtn">
                        Add Patient
                    </button>

                    <button type="reset" class="reset-btn"
                            onclick="resetForm()">
                        Clear
                    </button>
                </div>

            </form>
        </section>

        <section class="table-section">

            <h2>Patient Records</h2>

            <input type="text" id="search"
                   placeholder="Search by patient name or ID..."
                   oninput="displayPatients()">

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Age</th>
                            <th>Gender</th>
                            <th>Phone</th>
                            <th>Blood Group</th>
                            <th>Doctor</th>
                            <th>Appointment</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="patientTable">
                    </tbody>
                </table>
            </div>

            <p id="totalPatients">Total Patients: 0</p>

        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
